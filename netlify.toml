[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  framework = "vite"

# Aggressive no-cache for EVERYTHING. Every refresh re-fetches every file
# from the server — slower repeat visits but the user always sees the
# latest deploy without ever needing to clear their phone's cache.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
